<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korneev SCP Portfolio</title>
  <link rel="icon" href="https://www.root-me.org/favicon.ico" type="image/x-icon">\n  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="loader-screen" id="loader" role="status" aria-label="Chargement du portfolio">
    <div class="loader-content">
      <div class="loader-box" aria-hidden="true">
        <div class="progressbar">
          <div class="loader-side top"><div class="loader-fill"></div></div>
          <div class="loader-side bottom"><div class="loader-fill"></div></div>
          <div class="loader-side front"><div class="loader-fill"></div></div>
          <div class="loader-side back"><div class="loader-fill"></div></div>
          <div class="loader-side left"></div>
        </div>
      </div>
      <p class="loader-label">CHARGEMENT...</p>
    </div>
  </div>
  <header class="profile-wrap">
    <figure class="profile-card">
      <blockquote>
        <h2>À propos</h2>
        <p>Étudiant à l'École 2600, passionné par la cybersécurité, le développement et les systèmes. Je crée des outils, automatise des tâches et partage mes projets open source.</p>
        <div class="arrow" aria-hidden="true"></div>
      </blockquote>
      <figcaption class="author">
        <img class="avatar" src="https://github.com/korneevscp.png" alt="Photo de profil GitHub de korneevscp">
        <div class="author-copy">
          <h1>korneevscp</h1>
          <p>DevSecOps • Cybersécurité • Développement</p>
        </div>
      </figcaption>
    </figure>
  </header>
  <main class="container">
    <h2>Projets GitHub</h2>
    <section id="repos" class="grid"></section>
  </main>
  <script>
    window.setTimeout(() => {
      document.getElementById("loader").classList.add("is-hidden");
    }, 3000);
  </script>
  <script src="assets/app.js"></script>
</body>
</html>
